    // Web Audio Synthesizer for pleasant UI sound effects
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playCorrect() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, this.ctx.currentTime + 0.15); // E5
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      playError() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime); // A3
        osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
      playTap() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
    }

    function App() {
      // Load stored state or use default

        localStorage.setItem('linguaworld_user', JSON.stringify(user));

                      onStartRoleplay={(scenario) => setActiveRoleplayScenario(scenario)}

                      user={user} 
                      langObj={currentTargetLangObj}
                      onStartLesson={() => setActiveLesson('normal')}
                    />

                  {activeTab === 'challenges' && (

      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [userSentence, setUserSentence] = useState([]);
      const [isAnswerChecked, setIsAnswerChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [micFeedback, setMicFeedback] = useState(null);

      const currentExercise = exerciseList[currentIndex % exerciseList.length];

      const handleCheckAnswer = () => {
        let correct = false;

        if (currentExercise.type === 'vocab' || currentExercise.type === 'listening' || currentExercise.type === 'fill_blank') {
          correct = selectedOption === currentExercise.correctIndex;
        } else if (currentExercise.type === 'sentence_builder') {
          correct = userSentence.join(' ') === currentExercise.correctSentence;
        } else if (currentExercise.type === 'pronunciation') {
          correct = true; // Auto pass for demo speech feedback
        }

        setIsCorrect(correct);
        setIsAnswerChecked(true);

        if (correct) {
          sounds.playCorrect();
        } else {
          sounds.playError();
        }
      };

      const handleNextExercise = () => {
        if (currentIndex < exerciseList.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setSelectedOption(null);
          setUserSentence([]);
          setIsAnswerChecked(false);
          setIsCorrect(false);
          setMicFeedback(null);

          onCompleteLesson(30); // Award 30 XP

    function RoleplayModal({ user, langObj, scenario, onClose }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: `¡Hola! Soy tu asistente de práctica. ${scenario.prompt} ¿Qué te gustaría decir primero?` }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSend = async () => {
        if (!inputMsg.trim()) return;

        const newMsgs = [...messages, { role: 'user', text: inputMsg }];
        setMessages(newMsgs);
        setInputMsg('');
        setIsLoading(true);

        try {
          // Gemini API query call if network/key available
          const systemPrompt = `Eres un tutor de idiomas amigable. El usuario está aprendiendo ${langObj.name}. Su nivel es ${user.level}. Estás simulando el escenario: "${scenario.title}". Responde en el idioma que aprende (${langObj.name}) con frases sencillas y añade una breve traducción entre paréntesis. Manten las respuestas en 2 oraciones máximo.`;
          
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: newMsgs.map(m => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.text }]
              })),
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "That sounds great! Would you like anything else? (¡Suena genial! ¿Deseas algo más?)";
          
          setMessages([...newMsgs, { role: 'assistant', text: reply }]);
        } catch (err) {
          // Fallback offline mock response
          setMessages([...newMsgs, { 
            role: 'assistant', 
            text: `Very good choice! I have registered your response. (¡Muy buena elección! He registrado tu respuesta.)` 
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 flex items-center justify-center p-2 sm:p-4 animate-fade-in">
          <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200 dark:border-slate-800 h-[85vh] flex flex-col shadow-2xl">
            
            {/* Top Bar */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
              <div className="flex items-center gap-2">
                <span className="text-2xl">{scenario.icon}</span>
                <div>
                  <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">{scenario.title}</h3>
                  <div className="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold">Simulador Conversacional con IA</div>
                </div>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Chat Body */}
            <div className="flex-1 overflow-y-auto py-3 space-y-2.5 custom-scrollbar px-1">
              {messages.map((m, idx) => (
                <div key={idx} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`max-w-[85%] p-3 rounded-2xl text-xs ${
                    m.role === 'user' 
                      ? 'bg-emerald-600 text-white rounded-br-none font-medium' 
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-bl-none border border-slate-200 dark:border-slate-700'
                  }`}>
                    {m.text}
                  </div>
                </div>
              ))}
              {isLoading && (
                <div className="text-xs text-slate-400 italic">Escribiendo respuesta...</div>
              )}
            </div>

            {/* Input Footer */}
            <div className="pt-2 border-t border-slate-100 dark:border-slate-800 flex gap-2">
              <input 
                type="text" 
                placeholder="Escribe tu respuesta..."
                value={inputMsg}
                onChange={e => setInputMsg(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                className="flex-1 px-3.5 py-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs text-slate-800 dark:text-slate-200 outline-none focus:ring-2 focus:ring-emerald-500"
              />
              <button 
                onClick={handleSend}
                className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-xs"
              >
                <i data-lucide="send" className="w-4 h-4"></i>
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
